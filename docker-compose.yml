services:
  selenium:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    ports:
      - "4444:4444"
      - "7900:7900"  # noVNC para debug/captcha (opcional)
    environment:
      - SE_NODE_MAX_SESSIONS=1
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4444/wd/hub/status"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"  # ou 3000:3000 se preferires
    environment:
      - NODE_ENV=production  # muda para production no deploy
      - USE_SELENIUM_GRID=true
      - SELENIUM_REMOTE_URL=http://selenium:4444/wd/hub
      # as outras envs vêm do .env criado pelo Actions
    depends_on:
      selenium:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped